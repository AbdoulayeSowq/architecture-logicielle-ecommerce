services:
  postgres_db:
    container_name: postgres_db
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-macbookpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-lmsdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-macbookpro} -d ${POSTGRES_DB:-lmsdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin4:
    container_name: pgadmin4
    image: dpage/pgadmin4
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@lms.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  discovery-server:
    build:
      context: ./discovery-server
    image: emdy1/lms-discovery-server:latest
    container_name: discovery-server
    ports:
      - 8761:8761
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m
    networks:
      - lms-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: ./config-server
    image: emdy1/lms-config-server:latest
    container_name: config-server
    ports:
      - 8888:8888
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=native
      - JAVA_OPTS=-Xmx384m -Xms256m
    volumes:
      - ./config-repo:/app/config-repo
    networks:
      - lms-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api-gateway:
    build:
      context: ./api-gateway
    image: emdy1/lms-api-gateway:latest
    container_name: api-gateway
    ports:
      - 8080:8080
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_OPTS=-Xmx512m -Xms256m
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    networks:
      - lms-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started

  user-service:
    build:
      context: ./user-service
    image: emdy1/lms-user-service:latest
    container_name: user-service
    ports:
      - 8081:8081
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - USER_DB_URL=jdbc:postgresql://postgres_db:5432/user_db
      - DB_USERNAME=${DB_USERNAME:-macbookpro}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - lms-network
    depends_on:
      config-server:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    restart: unless-stopped

  university-service:
    build:
      context: ./university-service
    image: emdy1/lms-university-service:latest
    container_name: university-service
    ports:
      - 8082:8082
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - UNIVERSITY_DB_URL=jdbc:postgresql://postgres_db:5432/university_db
      - DB_USERNAME=${DB_USERNAME:-macbookpro}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - lms-network
    depends_on:
      config-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MC_HOST_local: http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@localhost:9000
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Piston — sandbox code execution (léger, ~40Mo vs 10Go pour Judge0)
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston/packages
    networks:
      - lms-network
    privileged: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Init: installe les top 5 langages dans Piston au premier démarrage
  piston-init:
    image: curlimages/curl:latest
    container_name: piston-init
    depends_on:
      - piston
    networks:
      - lms-network
    restart: on-failure
    command: >
      sh -c "
        echo 'Attente du démarrage de Piston...' &&
        until curl -sf http://piston:2000/api/v2/runtimes > /dev/null; do sleep 3; done &&
        echo 'Installation de Python...' &&
        curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{\"language\":\"python\",\"version\":\"3.10.0\"}' &&
        echo 'Installation de Java...' &&
        curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{\"language\":\"java\",\"version\":\"15.0.2\"}' &&
        echo 'Installation de JavaScript (Node)...' &&
        curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{\"language\":\"javascript\",\"version\":\"18.15.0\"}' &&
        echo 'Installation de C...' &&
        curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{\"language\":\"c\",\"version\":\"10.2.0\"}' &&
        echo 'Installation de C++...' &&
        curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{\"language\":\"c++\",\"version\":\"10.2.0\"}' &&
        echo 'Top 5 langages installés avec succès !'
      "

  course-service:
    build:
      context: ./course-service
    image: emdy1/lms-course-service:latest
    container_name: course-service
    ports:
      - 8083:8083
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - COURSE_DB_URL=jdbc:postgresql://postgres_db:5432/course_db
      - DB_USERNAME=${DB_USERNAME:-macbookpro}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=-Xmx512m -Xms256m
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-course-files}
    networks:
      - lms-network
    depends_on:
      config-server:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    restart: unless-stopped


  announcement-service:
    build:
      context: ./announcement-service
    image: emdy1/lms-announcement-service:latest
    container_name: announcement-service
    ports:
      - 8086:8086
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - ANNOUNCEMENT_DB_URL=jdbc:postgresql://postgres_db:5432/announcement_db
      - DB_USERNAME=${DB_USERNAME:-macbookpro}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - lms-network
    depends_on:
      config-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    image: emdy1/lms-ai-service:latest
    container_name: ai-service
    ports:
      - 8085:8085
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - AI_DB_URL=jdbc:postgresql://postgres_db:5432/ai_db
      - DB_USERNAME=${DB_USERNAME:-macbookpro}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - lms-network
    depends_on:
      config-server:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    restart: unless-stopped

  meeting-service:
    build:
      context: ./meeting-service
    image: emdy1/lms-meeting-service:latest
    container_name: meeting-service
    ports:
      - 8087:8087
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - MEETING_DB_URL=jdbc:postgresql://postgres_db:5432/meeting_db
      - DB_USERNAME=${DB_USERNAME:-macbookpro}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret123456789012345678901234567890}
      - LIVEKIT_SERVER_URL=ws://livekit:7880
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-wss://lms-ept.duckdns.org:7443}
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - lms-network
    depends_on:
      config-server:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: livekit_redis
    ports:
      - "6379:6379"
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit_server
    command: --config /etc/livekit.yaml --node-ip ${NODE_IP}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  practice-service:
    build:
      context: ./practice-service
    image: emdy1/lms-practice-service:latest
    container_name: practice-service
    ports:
      - "8084:8084"
    environment:
      - PRACTICE_DB_URL=jdbc:postgresql://postgres_db:5432/practice_db
      - DB_USERNAME=${DB_USERNAME:-macbookpro}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - PISTON_BASE_URL=http://piston:2000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - lms-network
    depends_on:
      postgres_db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
      piston:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  lms-frontend:
    build:
      context: ../lms-frontend
    image: emdy1/lms-frontend:latest
    container_name: lms-frontend
    ports:
      - "3000:80"
    networks:
      - lms-network
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  keycloak_db:
    container_name: keycloak_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
      POSTGRES_DB: keycloak_db
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /auth
    ports:
      - "9080:8080"
    networks:
      - lms-network
    depends_on:
      - keycloak_db
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 1024M

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  keycloak_db_data:
  piston_data:

networks:
  lms-network:
    driver: bridge
