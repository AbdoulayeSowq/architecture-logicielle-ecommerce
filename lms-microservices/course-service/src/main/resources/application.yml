# course-service — Configuration minimale locale
# Config centralisée dans config-repo/course-service.yml
# Valeurs sensibles dans lms-microservices/.env

spring:
  application:
    name: course-service
  config:
    import: "optional:configserver:http://localhost:8888"

# --- Fallback minimal ---
server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

spring.datasource:
  url: ${DB_URL}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:course-files}

judge0:
  base-url: ${JUDGE0_URL:http://localhost:2358}
  poll-interval-ms: 500
  max-poll-attempts: 40
  cpu-time-limit: 2
  memory-limit: 128000
  languages:
    python: 71
    java: 62
    cpp: 54
    javascript: 63
    php: 68
    dart: 70

# Judge0 config kept as fallback — now primarily handled by practice-service

spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  listener:
    auto-startup: ${KAFKA_AUTO_STARTUP:false}
  consumer:
    auto-offset-reset: earliest
    properties:
      allow.auto.create.topics: true
