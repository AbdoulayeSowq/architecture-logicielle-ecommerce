# ============================================================
# CONFIG COMMUNE — héritée par TOUS les microservices LMS
# Toutes les valeurs sensibles sont dans .env
# ⚠️  La datasource est définie dans chaque service (DB séparée)
# ============================================================

# --- Eureka Client ---
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# --- JPA commun (dialect, ddl-auto) ---
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    rest:
      detection-strategy: annotated
  # --- Kafka Commun ---
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: lms-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "com.lms.course.dto.UniversityEvent"

# --- SpringDoc (Swagger) ---
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
  default-consumes-media-type: application/json

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
