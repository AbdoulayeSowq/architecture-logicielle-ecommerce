name: EduMarket CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # 1. LINT & QUALITY
  # ----------------------------------------------------------------------------
  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven Configuration
        run: |
          cd lms-microservices/course-service
          ./mvnw validate

  # ----------------------------------------------------------------------------
  # 2. UNIT & INTEGRATION TESTS
  # ----------------------------------------------------------------------------
  test:
    name: Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit Tests (Order & Course Catalog)
        run: |
          cd lms-microservices/course-service
          ./mvnw test -Dtest=OrderServiceTest,OrderControllerTest

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: lms-microservices/course-service/target/surefire-reports/

  # ----------------------------------------------------------------------------
  # 3. BUILD ARTIFACTS
  # ----------------------------------------------------------------------------
  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Course Service JAR
        run: |
          cd lms-microservices/course-service
          ./mvnw clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-service-jar
          path: lms-microservices/course-service/target/*.jar

  # ----------------------------------------------------------------------------
  # 4. DOCKER VALIDATION & PACKAGE
  # ----------------------------------------------------------------------------
  docker-package:
    name: Docker Package & Validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f lms-microservices/docker-compose.yml config

  # ----------------------------------------------------------------------------
  # 5. DEPLOYMENT (Staging)
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Staging / Cloud
    needs: docker-package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Simulation
        run: |
          echo "=== Déploiement déclenché sur l'environnement Cloud Staging ==="
          echo "Images conteneurisées prêtes et validées."
          echo "Déploiement achevé avec succès !"
