name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (space-separated, e.g: lms-frontend course-service) or "all"'
        required: true
        default: 'lms-frontend'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      discovery-server: ${{ steps.changes.outputs.discovery-server }}
      config-server: ${{ steps.changes.outputs.config-server }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      user-service: ${{ steps.changes.outputs.user-service }}
      university-service: ${{ steps.changes.outputs.university-service }}
      course-service: ${{ steps.changes.outputs.course-service }}
      announcement-service: ${{ steps.changes.outputs.announcement-service }}
      ai-service: ${{ steps.changes.outputs.ai-service }}
      meeting-service: ${{ steps.changes.outputs.meeting-service }}
      config-repo: ${{ steps.changes.outputs.config-repo }}
      lms-frontend: ${{ steps.changes.outputs.lms-frontend }}
      docker-compose: ${{ steps.changes.outputs.docker-compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            discovery-server:
              - 'lms-microservices/discovery-server/**'
            config-server:
              - 'lms-microservices/config-server/**'
            api-gateway:
              - 'lms-microservices/api-gateway/**'
            user-service:
              - 'lms-microservices/user-service/**'
            university-service:
              - 'lms-microservices/university-service/**'
            course-service:
              - 'lms-microservices/course-service/**'
            announcement-service:
              - 'lms-microservices/announcement-service/**'
            ai-service:
              - 'lms-microservices/ai-service/**'
            meeting-service:
              - 'lms-microservices/meeting-service/**'
            config-repo:
              - 'lms-microservices/config-repo/**'
            lms-frontend:
              - 'lms-frontend/**'
            docker-compose:
              - 'lms-microservices/docker-compose.yml'

  build-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: discovery-server
            changed: ${{ needs.detect-changes.outputs.discovery-server }}
            image: emdy1/lms-discovery-server:latest
            context: ./lms-microservices/discovery-server
          - service: config-server
            changed: ${{ needs.detect-changes.outputs.config-server }}
            image: emdy1/lms-config-server:latest
            context: ./lms-microservices/config-server
          - service: api-gateway
            changed: ${{ needs.detect-changes.outputs.api-gateway }}
            image: emdy1/lms-api-gateway:latest
            context: ./lms-microservices/api-gateway
          - service: user-service
            changed: ${{ needs.detect-changes.outputs.user-service }}
            image: emdy1/lms-user-service:latest
            context: ./lms-microservices/user-service
          - service: university-service
            changed: ${{ needs.detect-changes.outputs.university-service }}
            image: emdy1/lms-university-service:latest
            context: ./lms-microservices/university-service
          - service: course-service
            changed: ${{ needs.detect-changes.outputs.course-service }}
            image: emdy1/lms-course-service:latest
            context: ./lms-microservices/course-service
          - service: announcement-service
            changed: ${{ needs.detect-changes.outputs.announcement-service }}
            image: emdy1/lms-announcement-service:latest
            context: ./lms-microservices/announcement-service
          - service: ai-service
            changed: ${{ needs.detect-changes.outputs.ai-service }}
            image: emdy1/lms-ai-service:latest
            context: ./lms-microservices/ai-service
          - service: meeting-service
            changed: ${{ needs.detect-changes.outputs.meeting-service }}
            image: emdy1/lms-meeting-service:latest
            context: ./lms-microservices/meeting-service
          - service: lms-frontend
            changed: ${{ needs.detect-changes.outputs.lms-frontend }}
            image: emdy1/lms-frontend:latest
            context: ./lms-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, matrix.service)))
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, matrix.service)))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push ${{ matrix.service }}
        if: matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, matrix.service)))
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [detect-changes, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

      - name: Compute services to deploy
        id: services
        run: |
          MANUAL="${{ github.event.inputs.services }}"
          if [ "$MANUAL" == "all" ]; then
            echo "list=discovery-server config-server api-gateway user-service university-service course-service announcement-service ai-service meeting-service lms-frontend" >> $GITHUB_OUTPUT
          elif [ -n "$MANUAL" ]; then
            echo "list=$MANUAL" >> $GITHUB_OUTPUT
          else
            DETECTED=""
            if [ "${{ needs.detect-changes.outputs.discovery-server }}" == "true" ]; then DETECTED="$DETECTED discovery-server"; fi
            if [ "${{ needs.detect-changes.outputs.config-server }}" == "true" ]; then DETECTED="$DETECTED config-server"; fi
            if [ "${{ needs.detect-changes.outputs.api-gateway }}" == "true" ]; then DETECTED="$DETECTED api-gateway"; fi
            if [ "${{ needs.detect-changes.outputs.user-service }}" == "true" ]; then DETECTED="$DETECTED user-service"; fi
            if [ "${{ needs.detect-changes.outputs.university-service }}" == "true" ]; then DETECTED="$DETECTED university-service"; fi
            if [ "${{ needs.detect-changes.outputs.course-service }}" == "true" ]; then DETECTED="$DETECTED course-service"; fi
            if [ "${{ needs.detect-changes.outputs.announcement-service }}" == "true" ]; then DETECTED="$DETECTED announcement-service"; fi
            if [ "${{ needs.detect-changes.outputs.ai-service }}" == "true" ]; then DETECTED="$DETECTED ai-service"; fi
            if [ "${{ needs.detect-changes.outputs.meeting-service }}" == "true" ]; then DETECTED="$DETECTED meeting-service"; fi
            if [ "${{ needs.detect-changes.outputs.lms-frontend }}" == "true" ]; then DETECTED="$DETECTED lms-frontend"; fi
            echo "list=$DETECTED" >> $GITHUB_OUTPUT
          fi
          echo "config_changed=${{ needs.detect-changes.outputs.config-repo }}" >> $GITHUB_OUTPUT
          echo "compose_changed=${{ needs.detect-changes.outputs.docker-compose }}" >> $GITHUB_OUTPUT

      - name: Deploy changed services on EC2
        uses: appleboy/ssh-action@v1
        env:
          SERVICES: ${{ steps.services.outputs.list }}
          CONFIG_CHANGED: ${{ steps.services.outputs.config_changed }}
          COMPOSE_CHANGED: ${{ steps.services.outputs.compose_changed }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key_path: /tmp/ec2_key.pem
          envs: SERVICES,CONFIG_CHANGED,COMPOSE_CHANGED
          script: |
            cd ~/lms/lms-microservices
            git pull origin main
            if [ "$CONFIG_CHANGED" == "true" ] || [ "$COMPOSE_CHANGED" == "true" ]; then
              echo "Config repo or docker-compose changed — pulling and recreating updated containers"
              docker-compose pull
              docker-compose up -d
            elif [ -n "$SERVICES" ]; then
              echo "Deploying: $SERVICES"
              docker-compose pull $SERVICES
              docker-compose up -d --force-recreate $SERVICES
            else
              echo "No services to deploy."
            fi
            
            # ✅ NETTOYAGE AUTOMATIQUE après deploy
            echo "🧹 Nettoyage des images Docker obsolètes..."
            docker image prune -af
            
            echo "🧹 Nettoyage des gros fichiers de logs..."
            sudo sh -c 'find /var/lib/docker/containers -name "*-json.log" -size +50M -exec truncate -s 10M {} \;'
            
            echo "💾 Espace disque après nettoyage:"
            df -h /
